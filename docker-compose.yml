services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # The official image ships the `ollama` CLI but not curl/wget; `ollama
      # list` talks to the local server over its API, so it only succeeds
      # once the server is actually accepting requests.
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Pulls the two models the app needs against the `ollama` service itself
  # (via OLLAMA_HOST, not localhost) so they land in the shared `ollama-data`
  # volume. `ollama pull` is idempotent — it no-ops if the model is already
  # present — so re-running `docker compose up` never re-downloads them.
  # This is what makes `docker compose up --build` a true single command.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull llama3.2 && ollama pull nomic-embed-text"
    restart: "no"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /data/chroma
      DATABASE_URL: sqlite+aiosqlite:////data/knowledgedesk.db
    volumes:
      - backend-data:/data
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama-data:
  backend-data:
