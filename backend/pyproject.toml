[project]
name = "knowledgedesk-backend"
version = "0.1.0"
description = "KnowledgeDesk backend — local RAG/chatbot/agent API powered by Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
    "python-docx>=1.2.0",
    "langchain-text-splitters>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "coverage>=7.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "main.py"]

[tool.uv]
package = false
